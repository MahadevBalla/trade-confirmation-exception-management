# Local dev environment: Kafka (KRaft, single broker), Kafka UI, CouchDB,
# and the five backend microservices + frontend.
#
# Usage:
#   docker compose up -d kafka kafka-ui couchdb      # just infra, run services from your IDE
#   docker compose up -d --build                      # everything, containerized
#
# Individual services can be commented out while you're developing them
# locally in an IDE (run against the infra containers via localhost ports).

name: tcem

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: tcem-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "tcem-capstone-cluster-01"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tcem-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  couchdb:
    image: couchdb:3.3
    container_name: tcem-couchdb
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
    volumes:
      - couchdb_data:/opt/couchdb/data

  ingestion-service:
    build:
      context: ./services
      dockerfile: ingestion-service/Dockerfile
    container_name: tcem-ingestion-service
    depends_on:
      - kafka
      - couchdb
    ports:
      - "${INGESTION_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COUCHDB_URL: http://couchdb:5984

  enrichment-service:
    build:
      context: ./services
      dockerfile: enrichment-service/Dockerfile
    container_name: tcem-enrichment-service
    depends_on:
      - kafka
      - couchdb
    ports:
      - "${ENRICHMENT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COUCHDB_URL: http://couchdb:5984

  validation-service:
    build:
      context: ./services
      dockerfile: validation-service/Dockerfile
    container_name: tcem-validation-service
    depends_on:
      - kafka
      - couchdb
    ports:
      - "${VALIDATION_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COUCHDB_URL: http://couchdb:5984

  exception-service:
    build:
      context: ./services
      dockerfile: exception-service/Dockerfile
    container_name: tcem-exception-service
    depends_on:
      - kafka
      - couchdb
    ports:
      - "${EXCEPTION_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COUCHDB_URL: http://couchdb:5984

  workitem-service:
    build:
      context: ./services
      dockerfile: workitem-service/Dockerfile
    container_name: tcem-workitem-service
    depends_on:
      - kafka
      - couchdb
    ports:
      - "${WORKITEM_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COUCHDB_URL: http://couchdb:5984

  frontend:
    build:
      context: ./frontend
    container_name: tcem-frontend
    depends_on:
      - ingestion-service
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  couchdb_data:
