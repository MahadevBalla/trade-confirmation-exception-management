spring:
  application:
    name: exception-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:exception-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}

server:
  port: ${SERVER_PORT:8084}

couchdb:
  url: ${COUCHDB_URL:http://localhost:5984}
  username: ${COUCHDB_USER:admin}
  password: ${COUCHDB_PASSWORD:password}
  exceptions-database: exceptions
  audit-events-database: audit-events
  auto-create-databases: true
  connection-timeout-ms: 3000
  read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
