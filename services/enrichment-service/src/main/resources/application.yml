spring:
  application:
    name: enrichment-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        # Bounds KafkaTemplate.send() while metadata is unavailable; send-timeout-ms bounds the wait after it.
        max.block.ms: 10000
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:enrichment-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}

server:
  port: ${SERVER_PORT:8082}

couchdb:
  url: ${COUCHDB_URL:http://localhost:5984}
  username: ${COUCHDB_USER:admin}
  password: ${COUCHDB_PASSWORD:password}
  idempotency-database: ${COUCHDB_ENRICHMENT_IDEMPOTENCY_DB:enrichment-idempotency}
  auto-create-databases: ${COUCHDB_AUTO_CREATE_DB:true}

# Upper limit on waiting for a Kafka publish while holding a consumer thread.
enrichment.kafka.send-timeout-ms: ${ENRICHMENT_KAFKA_SEND_TIMEOUT_MS:10000}

# Demo-only reference data. Counterparty/template values are based on the frontend;
# instrument IDs, template hints, and counterparty-product eligibility are local demo assumptions.
enrichment:
  reference-data:
    counterparties: reference-data/counterparties.json
    instruments: reference-data/instruments.json
    templates: reference-data/templates.json
    counterparty-products: reference-data/counterparty-products.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
