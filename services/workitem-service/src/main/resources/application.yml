spring:
  application:
    name: workitem-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 2000
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:workitem-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}

server:
  port: ${SERVER_PORT:8085}

workitem:
  max-replay-attempts: ${WORKITEM_MAX_REPLAY_ATTEMPTS:3}
  dlq-owner-queue: ${WORKITEM_DLQ_OWNER_QUEUE:TECHNOLOGY_SUPPORT}
  low-confidence-threshold: ${WORKITEM_LOW_CONFIDENCE_THRESHOLD:0.6}
  aged-hours: ${WORKITEM_AGED_HOURS:24}

couchdb:
  url: ${COUCHDB_URL:http://localhost:5984}
  username: ${COUCHDB_USER:admin}
  password: ${COUCHDB_PASSWORD:password}
  dlq-entries-database: ${COUCHDB_DLQ_DB:dlq-entries}
  work-items-database: ${COUCHDB_WORKITEMS_DB:work-items}
  audit-events-database: ${COUCHDB_AUDIT_DB:audit-events}
  auto-create-databases: ${COUCHDB_AUTO_CREATE_DB:true}
  connection-timeout-ms: 3000
  read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
