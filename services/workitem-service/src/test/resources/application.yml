spring:
  application:
    name: workitem-service-test
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1000
    consumer:
      group-id: workitem-service-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

workitem:
  max-replay-attempts: 3

couchdb:
  url: http://localhost:5984
  username: admin
  password: password
  dlq-entries-database: test-dlq-entries
  work-items-database: test-work-items
  audit-events-database: test-audit-events
  auto-create-databases: false
  connection-timeout-ms: 1000
  read-timeout-ms: 1000
