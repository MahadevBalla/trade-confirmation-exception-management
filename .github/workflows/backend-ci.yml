name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test all services (reactor)
        working-directory: services
        run: mvn -B verify
