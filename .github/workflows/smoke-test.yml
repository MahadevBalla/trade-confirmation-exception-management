name: e2e-smoke-test

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/**"
      - ".github/workflows/smoke-test.yml"

jobs:
  smoke-test:
    name: Cold Boot & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start the full stack
        run: |
          docker compose up -d --build --wait --wait-timeout 300 \
            kafka couchdb kafka-ui ingestion-service enrichment-service \
            validation-service exception-service workitem-service frontend

      - name: Verify service health and gateway routes
        run: ./scripts/smoke-test.sh --all

      - name: Verify the event pipeline end to end
        run: ./scripts/pipeline-test.sh

      - name: Exercise work-item API through the gateway
        run: |
          created=$(curl -fsS -u ops:ops-demo -X POST http://localhost:3000/api/workitems \
            -H 'Content-Type: application/json' \
            -d '{"tradeId":"TRD-SMOKE-1","type":"DATA_FIX","title":"Smoke test item","description":"created by CI","ownerQueue":"DATA_REMEDIATION","priority":"MEDIUM"}')
          echo "$created"
          id=$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workItemId"])')
          curl -fsS -u ops:ops-demo -X PATCH "http://localhost:3000/api/workitems/$id" \
            -H 'Content-Type: application/json' -d '{"status":"DONE","actor":"ci"}' | grep -q '"DONE"'
          curl -fsS "http://localhost:3000/api/workitems?tradeId=TRD-SMOKE-1" | grep -q "$id"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
